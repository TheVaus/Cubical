[package]
name = "cubical-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Tauri shell — a thin frontend over cubical-engine (the actual logic)."
default-run = "cubical-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The frontend-agnostic engine — handlers, state, events, IPC types.
cubical-engine = { path = "../cubical-engine" }
cubical-ipc = { path = "../cubical-ipc" }
tokio = { workspace = true }

# Panic isolation for the socket accept loop (FutureExt::catch_unwind).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Logging (init in `run` + the TauriEventSink adapter warns on emit failure).
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

# Tokenizes a console line the way a shell would (quoting, escapes) before clap parses it.

# Embedded terminal: PTY pair + child spawn, and the byte-safe wire encoding for
# PTY output (raw bytes, since a multi-byte character can split across chunks).
portable-pty = "0.9"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
# Graceful child reaping: SIGTERM, then SIGKILL after a grace period.
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
tempfile = { workspace = true }
# The graph integration test drives a real scan, so the index rows under test
# are the ones the scanner writes rather than hand-seeded SQL.
cubical-core = { path = "../cubical-core" }
tokio-util = { workspace = true }

[features]
# Empty by default so the gate and `tauri dev` compile the same feature set.
# `tauri build` supplies `custom-protocol` itself for production bundles; the
# dev loop runs `cargo run --no-default-features` and never wants it.
default = []
custom-protocol = ["tauri/custom-protocol"]
