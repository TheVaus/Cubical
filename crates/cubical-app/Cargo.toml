[package]
name = "cubical-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The Tauri shell — a thin frontend over cubical-engine (the actual logic)."
default-run = "cubical-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The frontend-agnostic engine — handlers, state, events, IPC types.
cubical-engine = { path = "../cubical-engine" }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Logging (init in `run` + the TauriEventSink adapter warns on emit failure).
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# By default, Tauri runs against the dev server.
# `custom-protocol` is enabled by `tauri build` for production bundles.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
