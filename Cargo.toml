[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/danielvekar/cubical"
authors = ["Daniel Vekar"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File I/O / watching
notify = "6"
notify-debouncer-full = "0.3"
walkdir = "2"

# Database
libsql = "0.6"

# Hashing
sha2 = "0.10"

# uuid + filetime are intentionally NOT in L0 — they land at L7 with frontmatter UUIDs.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Faster incremental builds during development
debug = 1
