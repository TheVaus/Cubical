[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/danielvekar/cubical"
authors = ["Daniel Vekar"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File I/O / watching
notify = "8"
notify-debouncer-full = "0.7"
walkdir = "2"

# Database — local-only. `default-features = false` + `core` drops libsql's
# remote/replication/tls stack (hyper, tonic, rustls-webpki, libsql-sqlite3-parser):
# a strictly local-first, no-cloud vault never opens a remote DB (only
# `Builder::new_local`), so compiling that machinery in is pure attack surface,
# binary bloat, and a stream of CVEs in code we never execute.
libsql = { version = "0.6", default-features = false, features = ["core"] }

# Hashing
sha2 = "0.11"

# Markdown parsing — used by `cubical-ast` for the canonical AST normalizer.
# CommonMark-conformant pull parser; MIT/Apache-2.0; no_std-compatible.
pulldown-cmark = { version = "0.13", default-features = false }

# Full-text search — Tantivy wrapper lives in `cubical-search` (L4-A).
tantivy = "0.26"

# Test-only — used as a dev-dep across crates that need an isolated FS.
tempfile = "3"

# OS trash/recycle bin — delete_path moves files/folders here instead of
# unlinking, so a sidebar delete is recoverable.
trash = "5"

# uuid + filetime are intentionally NOT in L0 — they land at L7 with frontmatter UUIDs.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Faster incremental builds during development
debug = 1
