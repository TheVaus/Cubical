name: CI

# Two jobs, deliberately:
#
#   static — the gates that need no build. Seconds, and they are the ones most
#            likely to be the real reason a change is wrong (a restated fact, a
#            stale generated artifact, a doc naming a deleted symbol). Running
#            them alongside the slow job means that feedback arrives in well
#            under a minute instead of after a full Rust build.
#   gates  — scripts/check.sh, the single source of truth for what "green"
#            means. It re-runs the static gates; they are cheap, and this keeps
#            one authoritative definition rather than two partial ones.
#
# Add or remove a gate in check.sh and the `gates` job follows automatically.
# The `static` job lists its gates explicitly because it is a fast subset, not
# a second definition — if the two ever disagree, check.sh wins.
#
# `gates` runs on three operating systems, because Cubical ships to three. Until
# it did, Linux was verified continuously, macOS only on the maintainer's own
# machine, and Windows by nothing at all — so every portability break waited for
# release day. The matrix is conditional; see the comment on the job itself.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # No `branches:` filter, deliberately. It used to be `[main]`, which meant a
  # pull request targeting any other branch — a stacked PR onto a feature branch
  # — ran no checks at all and reported "no checks reported", which reads as
  # green to anyone skimming. That is worse than a red build. Every PR gets the
  # matrix regardless of base.
  pull_request:

# A newer push to the same branch/PR supersedes in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static gates (no build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # Each of these prints the principle file that explains it when it fails.
      - name: comments
        run: python3 scripts/gates/comments.py
      - name: generated
        run: python3 scripts/gates/generated.py
      - name: ds-components
        run: python3 scripts/gates/ds_components.py
      - name: dependency-boundary
        run: python3 scripts/gates/dependency_boundary.py
      - name: techstack
        run: python3 scripts/gates/techstack.py
      - name: symbol-anchors
        run: python3 scripts/gates/symbol_anchors.py
      - name: docs
        run: python3 scripts/check_docs.py

  gates:
    # Every gate runs on all three shipped platforms, on every event. This is
    # affordable only because the repo is public: standard GitHub-hosted runners
    # do not bill against the Actions minute allowance for public repositories.
    # While it was private the same matrix was gated to main-and-tags, because
    # macOS bills at roughly 10x Linux against a 2,000 minute monthly budget —
    # so if this repo is ever made private again, that restriction has to come
    # back or the allowance is gone in under ten builds. Cost basis: issue #96.
    #
    # fail-fast is off on purpose: the point is to see all three results. A macOS
    # failure cancelling the Windows job hides exactly what this was built to learn.
    #
    # ubuntu-24.04 rather than 22.04 — the Ubuntu 22 images begin deprecation on
    # 2026-09-17 with brownout periods that hard-fail jobs. Note that a runner
    # label is not a support floor: pinning the glibc a release must run against
    # is a `container:` decision in the release workflow, not this one.
    name: Gate set (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    defaults:
      run:
        # Windows runners default to PowerShell, but check.sh and every gate it
        # calls are bash. Git Bash ships on the Windows image.
        shell: bash
    steps:
      # Third-party actions are pinned to commit SHAs (supply-chain hardening);
      # the trailing comment is the human-readable version. Dependabot's
      # github-actions ecosystem keeps these SHAs current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri 2 Linux build dependencies — required to compile cubical-app
      # (and therefore for cargo clippy / test / build across the workspace).
      # macOS and Windows carry their webview in the OS and need no equivalent.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      # The toolchain (version + rustfmt/clippy) is pinned by rust-toolchain.toml,
      # the single source of truth. Invoking a rustup proxy triggers the
      # override-file auto-install, so no third-party toolchain action is needed.
      - name: Install pinned Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            design-system/package-lock.json

      # A gate reaching into a new workspace directory needs its own install
      # step — the one thing CI does NOT follow automatically when check.sh
      # changes. Omitting one left npx resolving a registry package of the same
      # name, silently killing every downstream gate for twelve days.
      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Install design-system dependencies
        working-directory: design-system
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # The perf gate inside check.sh is opt-out by default (CUBICAL_PERF unset)
      # and is deliberately not enabled here: roughly a third of the scan budget
      # is Tantivy at min(cores, 8) threads, so a small hosted runner would flake
      # against a budget measured on a 10-core machine. The gate refuses to
      # assert below its declared machine class rather than scaling by a guess.
      # See scripts/perf-budget.json.
      - name: Run all gates
        run: bash scripts/check.sh

  bundle:
    # Proves an installable artifact can actually be produced. The gate set does
    # NOT prove this: it runs cargo clippy and cargo test, never `tauri build`,
    # so anything that only breaks at bundle time is invisible to it.
    #
    # That gap was not hypothetical. Every icon in the repo was a 1x1 PNG, and
    # icon.ico/icon.icns were PNGs wearing the wrong extension. Windows caught it
    # only because it compiles the icon into the executable as a resource at
    # build time; macOS and Linux stayed green while carrying the same broken
    # assets, and the first thing to fail would have been a release tag.
    #
    # Push and tag only, not per-PR. A full tauri build is ~15 minutes per
    # platform, and this catches a merge-time class of bug, not a review-time
    # one — tripling PR turnaround for it is a bad trade even though public
    # repos do not bill standard runners.
    name: Bundle smoke (${{ matrix.os }})
    if: github.event_name == 'push'
    needs: gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb
          - os: macos-14
            bundles: app,dmg
          - os: windows-latest
            bundles: msi
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            design-system/package-lock.json

      # tauri.conf.json's beforeBuildCommand runs `npm run build` in ui/, which
      # needs both workspaces installed first.
      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Install design-system dependencies
        working-directory: design-system
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # --debug keeps this a smoke test rather than a release build: it proves
      # bundling works without paying for a full optimised compile. Bundle
      # targets are per-platform so Linux does not pull AppImage's external
      # tooling on every run — the release workflow (#101) owns the full set.
      - name: Build bundle
        run: cargo tauri build --debug --bundles ${{ matrix.bundles }}

  ci:
    # The one check a branch ruleset should require, and the reason it exists:
    # `gates` and `bundle` interpolate the matrix into their names (`Gate set
    # (ubuntu-24.04)` and so on), so their names change whenever the matrix does.
    # A ruleset names required checks as fixed strings, and GitHub *waits* on a
    # required check that never reports rather than failing it — so a renamed job
    # does not turn a PR red, it freezes it on "waiting for status to be
    # reported" forever. This job's name never changes, so the ruleset has
    # exactly one stable thing to require. See #116.
    name: CI
    if: always()
    needs: [static, gates, bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every upstream job succeeded
        run: |
          echo "static=${{ needs.static.result }}"
          echo "gates=${{ needs.gates.result }}"
          echo "bundle=${{ needs.bundle.result }}"
          fail=0
          [ "${{ needs.static.result }}" = success ] || { echo "static did not succeed"; fail=1; }
          [ "${{ needs.gates.result }}" = success ] || { echo "gates did not succeed"; fail=1; }
          # `bundle` is deliberately push-only, so on a pull request it is
          # skipped. Treating skipped as failure here would fail every PR.
          case "${{ needs.bundle.result }}" in
            success|skipped) ;;
            *) echo "bundle did not succeed"; fail=1 ;;
          esac
          [ "$fail" = 0 ] && echo "all upstream jobs succeeded"
          exit $fail
