name: CI

# Runs the project's single gate set — scripts/check.sh — on every PR to main
# and every push to main. The script (fmt, clippy, Rust tests, tsc, vitest, UI
# build, docs check) is the source of truth; CI just sets up toolchains and runs
# it, so adding or removing a gate in check.sh updates CI automatically.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR supersedes in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gate set (scripts/check.sh)
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (supply-chain hardening);
      # the trailing comment is the human-readable version. Dependabot's
      # github-actions ecosystem keeps these SHAs current.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Tauri 2 Linux build dependencies — required to compile cubical-app
      # (and therefore for cargo clippy / test / build across the workspace).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      # The toolchain (version + rustfmt/clippy) is pinned by rust-toolchain.toml,
      # the single source of truth. Invoking a rustup proxy triggers the
      # override-file auto-install, so no third-party toolchain action is needed.
      - name: Install pinned Rust toolchain
        run: rustc --version && cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Run all gates
        run: bash scripts/check.sh
