# Dependabot keeps dependencies current and patches known vulnerabilities.
# Each opened PR is validated by the CI gate (.github/workflows/ci.yml) before
# it can be trusted. Minor/patch bumps are grouped to keep PR noise low; major
# bumps arrive as individual PRs since they're the ones that need a human look.
version: 2
updates:
  # Rust workspace (root Cargo.toml / Cargo.lock)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Frontend (ui/package.json / package-lock.json)
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Design system (design-system/package.json / package-lock.json).
  # It is a second npm workspace with its own lockfile and its own CI gate
  # (tsc). Without an entry here it received *security* PRs only — automated
  # security fixes work off alerts regardless of this file — so routine version
  # updates silently never arrived for the component library that ui/ consumes.
  - package-ecosystem: npm
    directory: /design-system
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Pinned GitHub Actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
